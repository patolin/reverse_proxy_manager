services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/app.sqlite
      TRAEFIK_DYNAMIC_DIRECTORY: /app/proxy-dynamic
      DEPLOYMENT_QUEUE_PATH: /app/deployment-queue/jobs.sqlite
      ADMIN_HOST: ${ADMIN_HOST:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - manager_data:/app/data
      - deployment_queue:/app/deployment-queue
      - proxy_dynamic:/app/proxy-dynamic
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3

  deploy-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DEPLOYMENT_QUEUE_PATH: /queue/jobs.sqlite
      DEPLOYMENT_ROOT: /deployments
      PROXY_NETWORK_NAME: reverse-proxy-manager-proxy
    volumes:
      - deployment_queue:/queue
      - deployment_files:/deployments
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app:
        condition: service_healthy

  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host-backend:host-gateway"
    volumes:
      - traefik_data:/data
      - proxy_dynamic:/etc/traefik/dynamic:ro
    networks:
      - proxy

  fallback:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./fallback:/usr/share/nginx/html:ro
    networks:
      - proxy

volumes:
  manager_data:
  deployment_queue:
  deployment_files:
  proxy_dynamic:
  traefik_data:

networks:
  proxy:
    name: reverse-proxy-manager-proxy
